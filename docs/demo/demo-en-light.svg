<svg xmlns="http://www.w3.org/2000/svg" width="860" height="278" viewBox="0 0 860 278" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">wickrun-brain demo</title>
<desc id="d">$ wickrun-brain status
  settings file   ~/.claude/settings.json
  mode            official login (no override)
  overrides       none

$ wickrun-brain use work-gateway
Switched Claude Code to profile &quot;work-gateway&quot;: llm.example.com, model claude-sonnet-4-6.
Updated ~/.claude/settings.json (original saved for &quot;restore&quot;).
Start a new Claude Code session for the change to take effect.

$ wickrun-brain status
  settings file   ~/.claude/settings.json
  mode            custom endpoint (profile &quot;work-gateway&quot;)
  base URL host   llm.example.com
  model           claude-sonnet-4-6
  key             ANTHROPIC_AUTH_TOKEN …7f3a
  backup          settings.json.before-wickrun-brain

  Undo every change with: wickrun-brain restore

$ wickrun-brain restore
settings.json restored, byte-identical to the original (sha256 27dafb2742d0).
Backup deleted.
Start a new Claude Code session for the change to take effect.</desc>
